stage: 3
objective: joint_curriculum
lr: 5.0e-5
steps: 10000
global_batch: 256
warmup_frac: 0.03
optimizer: {name: adamw, betas: [0.9, 0.95], weight_decay: 0.1}
grad_clip: 1.0
precision: bf16
parallel: {strategy: zero3}
losses: {classification: 1.0, severity: 1.0, vqa: 1.0,
         mae: "0.5 * (1 - step/steps)"}
severity: {lambda_ord: 0.3, margin: 0.1}
